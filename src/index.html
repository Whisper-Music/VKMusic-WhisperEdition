<!doctype html>
<html lang="ru" data-anim="on" data-style="neon" data-base="neon">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VK Music</title>
  <!-- Разметка — как у Whisper Yandex (те же классы и id): темы Whisper (@@ css whisper-music) ложатся на неё целиком.
       whisper.css — основа оформления Whisper (Неон, Королевский, Стимпанк, Lolitta); app.css — то, чего у Whisper нет. -->
  <!-- до первой отрисовки: стиль прошлого запуска, интерфейс скрыт, пока тема не применится (без «мигания» Неона) -->
  <script src="boot.js"></script>
  <link rel="stylesheet" href="core/base.css" />
  <link rel="stylesheet" href="whisper.css" />
  <link rel="stylesheet" href="core/together.css" />
  <link rel="stylesheet" href="app.css" />
  <link rel="stylesheet" href="core/archive.css" />
  <link rel="stylesheet" href="core/queue.css" />
  <link rel="stylesheet" href="core/discord.css" />
  <link rel="stylesheet" href="core/obs.css" />
  <!-- CSS темы: @@ css whisper-core (роли) → @@ css whisper-music → @@ css whisper-vk → tokens; привязан к стилю
       (:root[data-style="<id>"]) движком тем ядра -->
  <style id="theme-css"></style>
</head>
<body>
  <!-- фон темы: картинка — переменной --bg-image на #bg, видео — #bgVideo внутри (темы задают #bg место и форму) -->
  <!-- #dynBg — динамический фон по обложке трека (как у Whisper Yandex; правила — в whisper.css, .dynbg) -->
  <div id="bg"><video id="bgVideo" muted loop playsinline disablepictureinpicture disableremoteplayback preload="auto" hidden></video><div id="dynBg" class="dynbg" aria-hidden="true">
    <div class="dyn-l"></div><div class="dyn-l"></div>
    <div class="dyn-art"><i></i><i></i></div>
    <div class="dyn-aura"></div>
    <div class="dyn-grain"></div>
  </div></div>
  <div id="dim"></div>

  <!-- своя полоса заголовка окна (окно без рамки системы): темы рисуют её по-своему -->
  <div id="titlebar" class="titlebar">
    <div class="tbtitle">
      <span class="tbdot"></span>
      <span class="tbtext">
        <span class="tbbrand">VK Music</span>
        <span class="tbsubtitle">Whisper VK</span>
      </span>
    </div>
    <div class="tbctl">
      <button id="wMin" title="Свернуть"><svg viewBox="0 0 12 12" width="12" height="12"><path d="M2 6h8" fill="none" stroke="currentColor" stroke-width="1.2"/></svg></button>
      <button id="wMax" title="Развернуть"><svg viewBox="0 0 12 12" width="12" height="12"><rect x="2.5" y="2.5" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1.2"/></svg></button>
      <button id="wClose" class="wclose" title="Закрыть"><svg viewBox="0 0 12 12" width="12" height="12"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" fill="none" stroke="currentColor" stroke-width="1.2"/></svg></button>
    </div>
  </div>

  <div class="app">
    <!-- закладки: разделы библиотеки (Треки / Плейлисты / Загрузки) -->
    <header class="tabs" id="tabs"></header>

    <aside class="panel side">
      <input id="search" class="search" type="search" placeholder="Найти трек или вставить ссылку" autocomplete="off" spellcheck="false" maxlength="2048" />
      <button class="nav" id="wave" data-page="wave">VK Микс</button>
      <button class="nav active" id="likes" data-page="library">Библиотека<span class="nav-badge" id="dlBadge" hidden></span></button>
      <button class="nav" id="mixes" data-page="vk">Миксы и плейлисты</button>
      <button class="nav" id="statsBtn" data-page="stats">Статистика</button>
      <button class="nav" id="settingsBtn" data-page="settings">Настройки</button>
      <div class="spacer"></div>
      <p class="status queue-mini" id="queueInfo"></p>
      <button class="nav" id="profile" data-page="services">Сервисы</button>
    </aside>

    <main class="main">
      <div class="head">
        <button id="back" class="round" hidden title="Назад">←</button>
        <img id="headImg" class="headimg sq" alt="" hidden />
        <div class="headtext">
          <h2 id="title">Библиотека</h2>
          <div id="sub" class="sub" hidden></div>
        </div>
        <div id="waveInfo" class="waveinfo headinfo" hidden>
          <p id="waveHint" class="wavehint">Нажми, чтобы включить VK Микс</p>
          <div id="nowplay" class="nowplay" hidden>
            <div id="waveTitle" class="nptitle"></div>
            <div id="waveArtist" class="npartist"></div>
          </div>
        </div>
        <!-- кнопки страницы справа в шапке (обновить, «Слушать», «Магазин тем» …) -->
        <div class="headbtns" id="headBtns"></div>
      </div>
      <div id="chips" class="chips" hidden></div>

      <!-- страница «VK Микс»: кнопка бесконечного потока, орбиты вокруг неё рисуют стили и темы -->
      <section id="wavePage" class="wavepage" hidden>
        <div class="stage">
          <div id="waveOrbits" class="waveorbits" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
          <button id="waveBtn" class="wavebtn" title="VK Микс"></button>
        </div>
      </section>

      <!-- остальные страницы: список треков, миксы, поиск, статистика, магазин тем -->
      <div id="content" class="content"></div>

      <!-- настройки: вкладки-чипы и карточки (карточки модулей ядра — постоянные, вставляются при запуске) -->
      <section id="settingsPage" class="settings" data-tab="look" hidden>
        <nav class="settabs" id="setTabs" role="tablist">
          <button type="button" class="chip" data-tab="look" role="tab">Оформление</button>
          <button type="button" class="chip" data-tab="ui" role="tab">Общее</button>
          <button type="button" class="chip" data-tab="out" role="tab">Хранилище</button>
          <button type="button" class="chip" data-tab="int" role="tab">Интеграции</button>
        </nav>
      </section>
    </main>

    <footer class="panel player">
      <div class="pinfo">
        <img id="cover" class="cover" alt="" title="Текст и обложка на весь экран" />
        <div class="meta"><b id="pTitle">Ничего не играет</b><span id="pArtist"></span></div>
        <!-- «сердце» — трек в библиотеке: у трека сервиса не из библиотеки — добавить -->
        <button id="likeBtn" class="likebtn" title="В библиотеку" hidden></button>
      </div>

      <div class="pcenter">
        <div class="seekrow">
          <span class="time" id="tCur">0:00</span>
          <input id="seek" type="range" min="0" max="1000" value="0" />
          <span class="time" id="tDur">0:00</span>
        </div>
        <div class="ctrls">
          <button id="shuffleBtn" class="modebtn" title="Перемешать"></button>
          <button id="prev" title="Предыдущий"><svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
          <button id="play" class="playbtn" title="Пауза / играть (Пробел)"></button>
          <button id="next" title="Следующий"><svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
          <button id="repeatBtn" class="modebtn" title="Повтор"></button>
        </div>
      </div>

      <div class="pright">
        <button id="lyrBtn" class="modebtn lyrbtn" title="Текст песни"></button>
        <button id="normBtn" class="modebtn" title="Постоянный уровень громкости"></button>
        <div class="volwrap" id="volWrap">
          <button id="volBtn" title="Громкость (клик — выключить звук)"></button>
          <div class="volpop">
            <span id="volVal" class="volval">70</span>
            <div class="volbox"><input id="vol" type="range" min="0" max="100" value="70" /></div>
          </div>
        </div>
        <button id="pMore" class="morebtn pmore" title="Ещё" disabled></button>
      </div>
    </footer>
  </div>

  <!-- обложка и текст песни на весь экран (нажатие на обложку в плеере) -->
  <div id="full" class="full" data-mode="cover" hidden>
    <div id="fBg" class="fbg"></div>
    <div class="fwrap">
      <button id="fClose" class="round fclose" title="Свернуть (Esc)">✕</button>
      <div id="fSrc" class="fsrc" role="group" aria-label="Текст песни">
        <button type="button" id="fLyrBtn" title="Текст песни">Текст</button>
        <select id="fLang" class="np-lyrics-lang" title="Язык текста" hidden></select>
        <label class="fnotes" id="fNotesBox" title="Пояснения Genius к строкам" hidden><input type="checkbox" id="fNotes" /><span>Пояснения</span></label>
        <button type="button" id="fGenius" title="Открыть песню на Genius" hidden>Genius</button>
      </div>
      <header id="fHead" class="fhead">
        <img id="fCover" class="fcover" alt="" />
        <div id="fTitles" class="ftitles">
          <div id="fTitle" class="ftitle"></div>
          <div id="fArtist" class="fartist"></div>
          <div id="fInfo" class="finfo"></div>
        </div>
      </header>
      <div id="fLyrics" class="flyrics"></div>
      <!-- пояснение Genius к фрагменту текста -->
      <div class="lyr-note" id="lyrNote" hidden></div>
      <footer class="fctrl">
        <div class="fseek">
          <span id="fTCur" class="time">0:00</span>
          <input id="fSeek" type="range" min="0" max="1000" value="0" />
          <span id="fTDur" class="time">0:00</span>
        </div>
        <div class="fbtns">
          <button id="fLike" class="likebtn" hidden></button>
          <button id="fPrev" title="Предыдущий"><svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
          <button id="fPlay" class="playbtn" title="Пуск/пауза"></button>
          <button id="fNext" title="Следующий"><svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
        </div>
      </footer>
    </div>
  </div>

  <!-- пока открыта страница входа сервиса, окно интерфейса сжато до этой полосы (как в NK-Player) -->
  <div class="login-bar" id="loginBar" hidden>
    <span id="loginBarText"></span>
    <button class="nav" id="loginCancel">Отмена</button>
  </div>
  <div class="drop-hint" id="dropHint" hidden><div>Отпустите файл .wmt, чтобы установить тему</div></div>
  <!-- одна подсказка внизу по центру, как у Whisper -->
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <!-- ядро Whisper — первым: app.js сообщает ему о плеере и очереди -->
  <script src="core/whisper-core.js"></script>
  <!-- локализация: функции и словари (ключ — русский текст) -->
  <script src="i18n/i18n.js"></script>
  <script src="i18n/ru.js"></script>
  <script src="i18n/en.js"></script>
  <script src="icons.js"></script>
  <script src="app.js"></script>
  <script src="hotkeys.js"></script>
  <!-- привязка к ядру (роли, провайдер, плеер, очередь) — до движка тем и модулей; app.js запускается
       по DOMContentLoaded, когда всё ниже уже подключено -->
  <script src="whisper-vk.js"></script>
  <script src="core/wmt.js"></script>
  <script src="core/theme-css.js"></script>
  <!-- модули ядра: порядок = порядок их карточек в «Интеграциях» -->
  <script src="core/archive.js"></script>
  <script src="core/queue.js"></script>
  <script src="core/discord.js"></script>
  <script src="core/obs.js"></script>
  <script src="core/together.js"></script>
</body>
</html>
