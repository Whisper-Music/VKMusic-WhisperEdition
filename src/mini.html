<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Мини-плеер VK Music</title>
  <link rel="stylesheet" href="mini.css" />
  <script src="mini.js" defer></script>
</head>
<body>
  <!-- Мини-плеер (tray.rs): что играет — от главного окна (mini_state), кнопки — mini_ctl. Подписи — от главного окна. -->
  <div class="mp" id="mp">
    <div class="cvwrap"><img id="cv" class="cv" alt="" /></div>
    <div class="top">
      <div class="tx">
        <b id="t"></b>
        <span id="a"></span>
      </div>
      <div class="tools">
        <button data-a="open" id="open"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M14 4h6v6M20 4l-8 8M10 5H5v14h14v-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button data-a="hide" id="hide"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      </div>
    </div>
    <div class="ctl">
      <button data-a="shuffle" id="sh" class="mode"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 7h3c4 0 6 10 10 10h3M4 17h3c1.6 0 2.8-1.5 3.8-3.4M14 9.4C15 7.6 16 7 17 7h3M18 5l2 2-2 2M18 15l2 2-2 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button data-a="prev" id="pv"><svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
      <button data-a="toggle" id="pp" class="play"></button>
      <button data-a="next" id="nx"><svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
      <button data-a="like" id="lk" class="mode"></button>
    </div>
    <div class="bar"><i id="bar"></i></div>
  </div>
</body>
</html>
