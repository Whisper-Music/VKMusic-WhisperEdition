[package]
name = "vkmusic"
version = "0.1.4"
edition = "2021"
description = "VK Music Whisper Edition — музыкальный плеер на Rust + Tauri: ВКонтакте, SoundCloud, свои файлы, темы Whisper"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/Whisper-Music/VKMusic-WhisperEdition"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
# custom-protocol: интерфейс встраивается в бинарник, поэтому хватает обычного `cargo build`/`cargo run`
# unstable: страница входа ВК — второй webview в главном окне (Window::add_child), как в NK-Player
# tray-icon: значок в трее и мини-плеер (tray.rs)
tauri = { version = "2.12", features = ["custom-protocol", "unstable", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
base64 = "0.22"
regex = "1"
lofty = "0.25"
dirs = "6"
libc = "0.2"
# библиотека тем (raw.githubusercontent.com) и ВКонтакте (charset: страницы ВК бывают в windows-1251)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "charset", "cookies"] }
# уже есть в зависимостях Tauri; нужны пауза между запросами к ВК и асинхронный мьютекс
tokio = { version = "1", features = ["time", "sync"] }

# ── Rust-часть ядра Whisper (src/core/rust: Whisper Archive, «Слушать вместе», Discord, OBS) ──
# ядро ходит в сеть через reqwest, который реэкспортирует плагин (tauri_plugin_http::reqwest); сам плагин не подключается
tauri-plugin-http = "2"
# ключ виджета OBS и временные имена файлов секретов — случайные байты
getrandom = "0.3"
# ссылки whisper://room/КОД — приглашения в комнату «Слушать вместе» (deeplink.rs)
tauri-plugin-deep-link = "2"
# второй запуск (в том числе по ссылке whisper://) не открывает новую копию, а отдаёт ссылку уже запущенной
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# глобальные горячие клавиши (hotkeys.rs): Windows — RegisterHotKey, Linux — X11
tauri-plugin-global-shortcut = "2"

[target.'cfg(target_os = "linux")'.dependencies]
# раскладка главного окна на время входа ВК (тот же gtk 0.18, что у Tauri)
gtk = "0.18"
# куки WebKit как есть: wry (Webview::cookies) теряет ведущую точку домена — «.vk.ru» становится «vk.ru»,
# кука перестаёт уходить на login.vk.ru, а удалить её через wry нельзя (те же версии, что у wry)
webkit2gtk = "2.0"
soup3 = "0.5"
# ключ Whisper Archive — в системной «связке ключей» (Secret Service: GNOME Keyring, KWallet, KeePassXC);
# vendored — libdbus собирается вместе с приложением
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust", "vendored"] }

[target.'cfg(windows)'.dependencies]
# автообновление (только Windows: на Linux — пакеты/AUR): latest.json из GitHub Releases, подпись minisign
tauri-plugin-updater = "2"
# ключ Whisper Archive — в диспетчере учётных данных Windows
keyring = { version = "3", features = ["windows-native"] }
# куки WebView2 как есть (те же версии, что у wry)
webview2-com = "0.39"
windows = "0.62"
# mpv: именованный канал (асинхронный — чтение и запись одновременно)
tokio = { version = "1", features = ["time", "sync", "net", "io-util", "rt"] }
# mpv закрывается вместе с приложением (Job Object)
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects"] }
