# Рабочее пространство: приложение — в src-tauri (раскладка Tauri, как у приложений Whisper),
# интерфейс — в src, ядро Whisper — подмодулем в src/core. `cargo build --release` из корня, как раньше.
[workspace]
members = ["src-tauri"]
resolver = "2"

[profile.release]
codegen-units = 1
lto = true
strip = true
